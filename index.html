<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Políticas y procesos — Despacho contable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#E9EAE3;
  --card:#FBFBF7;
  --ink:#1C2321;
  --soft:#5C645F;
  --faint:#8C938E;
  --rule:#D2D3C7;
  --rule-hard:#B6B8A9;
  --guinda:#8E2340;
  --guinda-wash:#F3E4E7;
  --ok:#2D6A4C;
  --ok-wash:#E2EDE5;
  --nuevo:#175C6B;
  --nuevo-wash:#DDEAED;
  --warn:#8A6410;
  --warn-wash:#F3EBD8;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
a{color:var(--guinda)}
:focus-visible{outline:2px solid var(--guinda);outline-offset:2px}

/* ---------- marco ---------- */
.marco{max-width:1220px;margin:0 auto;padding:0 20px 80px}

.tope{
  display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
  padding:22px 0 16px;border-bottom:1px solid var(--rule-hard);
}
.marca{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.01em}
.marca span{color:var(--guinda)}
.sello{
  font-size:12px;color:var(--soft);border:1px solid var(--rule-hard);
  padding:2px 8px;border-radius:2px;background:var(--card);
}
.buscador{margin-left:auto;position:relative;flex:1;min-width:240px;max-width:380px}
.buscador input{
  width:100%;font-family:inherit;font-size:14px;padding:8px 12px;
  border:1px solid var(--rule-hard);border-radius:2px;background:var(--card);color:var(--ink);
}
.buscador input::placeholder{color:var(--faint)}
.resultados{
  position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:30;
  background:var(--card);border:1px solid var(--rule-hard);max-height:340px;overflow:auto;
  box-shadow:0 8px 20px rgba(28,35,33,.12);
}
.resultados button{
  display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--rule);padding:9px 12px;line-height:1.35;
}
.resultados button:hover,.resultados button:focus{background:var(--paper)}
.resultados .rtipo{font-size:11px;color:var(--guinda);display:block}
.resultados .rtxt{font-size:13.5px;color:var(--soft)}

.cuerpo{display:grid;grid-template-columns:212px 1fr;gap:34px;padding-top:26px;align-items:start}
nav.rail{position:sticky;top:18px}
.rail h4{
  font-family:var(--sans);font-size:12px;font-weight:600;color:var(--faint);
  margin:20px 0 7px;letter-spacing:.02em;
}
.rail h4:first-child{margin-top:0}
.rail button{
  display:flex;width:100%;align-items:baseline;gap:8px;text-align:left;
  background:none;border:0;padding:5px 9px;border-radius:2px;color:var(--soft);
  border-left:2px solid transparent;
}
.rail button:hover{color:var(--ink);background:#E1E2DA}
.rail button[aria-current="true"]{color:var(--ink);font-weight:600;border-left-color:var(--guinda);background:#E1E2DA}
.rail .cuenta{margin-left:auto;font-size:12px;color:var(--faint);font-weight:400}
.rail .cuenta.alerta{color:var(--guinda);font-weight:600}
.rail button[data-v="cambios"] .cuenta.alerta{color:var(--nuevo)}
.rail button[data-v="cambios"][aria-current="true"]{border-left-color:var(--nuevo)}

/* ---------- tipografía de contenido ---------- */
h1{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.15;letter-spacing:-.015em;margin:0 0 6px}
h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:34px 0 12px;letter-spacing:-.01em}
h3{font-size:14px;font-weight:600;margin:22px 0 8px}
.entrada{color:var(--soft);max-width:66ch;margin:0 0 26px;font-size:15.5px}
p{max-width:70ch}

/* ---------- piezas ---------- */
.ficha{background:var(--card);border:1px solid var(--rule);padding:18px 20px;margin-bottom:14px}
.ficha-tope{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.ficha-tope h3{margin:0;font-size:16px;font-family:var(--serif);font-weight:600}
.marbete{
  font-size:11px;padding:2px 7px;border-radius:2px;white-space:nowrap;
  border:1px solid currentColor;flex-shrink:0;
}
.m-ok{color:var(--ok);background:var(--ok-wash)}
.m-alto{color:var(--guinda);background:var(--guinda-wash)}
.m-tibio{color:var(--warn);background:var(--warn-wash)}
.m-gris{color:var(--soft);background:var(--paper)}
.fuente{font-size:12.5px;color:var(--faint);margin-top:10px}

.cita{
  font-family:var(--serif);font-size:15.5px;line-height:1.55;
  border-left:2px solid var(--rule-hard);padding:2px 0 2px 14px;margin:0 0 4px;color:var(--ink);
}
.cita-pie{font-size:12px;color:var(--faint);padding-left:16px;margin-bottom:14px}
.cita-guia{margin-bottom:0}
ul.condiciones{
  margin:0 0 4px;padding:0 0 0 16px;list-style:none;
  border-left:2px solid var(--rule-hard);max-width:70ch;
}
ul.condiciones li{
  font-family:var(--serif);font-size:15.5px;line-height:1.55;
  padding:6px 0 6px 20px;position:relative;
}
ul.condiciones li::before{
  content:"";position:absolute;left:2px;top:15px;
  width:9px;height:1px;background:var(--rule-hard);
}

.versus{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--rule-hard);margin:12px 0}
.versus > div{padding:14px 16px}
.versus > div:first-child{border-right:1px solid var(--rule-hard)}
.versus h5{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--guinda)}
.versus p{margin:0;font-family:var(--serif);font-size:15px;line-height:1.5}

ul.lista{margin:0;padding-left:18px;max-width:70ch}
ul.lista li{margin-bottom:6px}

/* ---------- consulta / árbol ---------- */
.casos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:30px}
.caso{
  background:var(--card);border:1px solid var(--rule-hard);padding:15px 16px;text-align:left;
  border-radius:2px;line-height:1.35;
}
.caso:hover{border-color:var(--guinda);background:#fff}
.caso b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:4px}
.caso i{font-style:normal;font-size:12.5px;color:var(--faint)}

.hilo{border-left:2px solid var(--rule-hard);padding-left:20px;margin-left:4px}
.paso{margin-bottom:20px;position:relative}
.paso::before{
  content:"";position:absolute;left:-26px;top:7px;width:9px;height:9px;
  background:var(--paper);border:2px solid var(--rule-hard);border-radius:50%;
}
.paso.viva::before{background:var(--guinda);border-color:var(--guinda)}
.pregunta{font-family:var(--serif);font-size:19px;font-weight:500;margin:0 0 10px;line-height:1.3}
.opciones{display:flex;flex-wrap:wrap;gap:8px}
.opciones button{
  background:var(--card);border:1px solid var(--rule-hard);padding:7px 14px;border-radius:2px;font-size:14px;
}
.opciones button:hover{border-color:var(--guinda);color:var(--guinda)}
.elegida{font-size:14px;color:var(--soft)}
.elegida b{color:var(--ink);font-weight:600}

.poliza{background:var(--card);border:1px solid var(--ink);padding:0;margin:6px 0 14px;max-width:640px}
.poliza-tope{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:10px 16px;border-bottom:1px solid var(--ink);background:var(--ink);color:var(--paper);
}
.poliza-tope b{font-family:var(--serif);font-size:15px;font-weight:600}
.poliza-tope span{font-size:11.5px;opacity:.75}
table.asiento{width:100%;border-collapse:collapse;font-size:14px}
table.asiento th{
  text-align:right;font-size:11px;font-weight:600;color:var(--faint);
  padding:7px 16px 5px;border-bottom:1px solid var(--rule);
}
table.asiento th:first-child{text-align:left}
table.asiento td{padding:7px 16px;border-bottom:1px solid var(--rule);text-align:right}
table.asiento td:first-child{text-align:left;font-family:var(--serif);font-size:15px}
table.asiento tr:last-child td{border-bottom:0}
table.asiento .sangria{padding-left:38px}
.narra{padding:12px 16px;font-size:13.5px;color:var(--soft);border-top:1px solid var(--rule);background:var(--paper)}

.acciones{background:var(--warn-wash);border:1px solid #E0D0A8;padding:14px 16px;max-width:640px;margin-bottom:14px}
.acciones h5{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--warn)}
.acciones ul{margin:0;padding-left:18px;font-size:14px}
.acciones li{margin-bottom:4px}

.frena{background:var(--guinda-wash);border:1px solid #D9B3BD;padding:16px;max-width:640px;margin-bottom:14px}
.frena h5{margin:0 0 6px;font-size:15px;font-family:var(--serif);font-weight:600;color:var(--guinda)}
.frena p{margin:0 0 8px;font-size:14px}

.btn{
  background:var(--ink);color:var(--paper);border:1px solid var(--ink);
  padding:8px 16px;border-radius:2px;font-size:14px;
}
.btn:hover{background:var(--guinda);border-color:var(--guinda)}
.btn-hueco{background:none;color:var(--ink);border:1px solid var(--rule-hard)}
.btn-hueco:hover{background:var(--card);color:var(--guinda);border-color:var(--guinda)}
.fila-btn{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* ---------- tablas ---------- */
table.datos{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--rule)}
table.datos th{
  text-align:left;font-size:11.5px;font-weight:600;color:var(--faint);
  padding:8px 12px;border-bottom:1px solid var(--rule-hard);vertical-align:bottom;
}
table.datos td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.4}
table.datos tr:last-child td{border-bottom:0}
table.datos .sig{font-weight:600;white-space:nowrap}
table.datos .vacio{color:var(--faint);font-style:italic}

.vacio-caja{
  border:1px dashed var(--rule-hard);background:repeating-linear-gradient(135deg,transparent,transparent 7px,#E3E4DC 7px,#E3E4DC 8px);
  padding:18px 20px;margin-bottom:14px;
}
.vacio-caja h3{margin:0 0 4px}
.vacio-caja p{margin:0 0 10px;font-size:14px;color:var(--soft)}

.enlaces{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.enlaces button{
  background:none;border:1px solid var(--rule-hard);padding:4px 10px;border-radius:2px;
  font-size:12.5px;color:var(--soft);
}
.enlaces button:hover{color:var(--guinda);border-color:var(--guinda)}

.aviso{
  display:flex;gap:12px;background:var(--guinda);color:#fff;padding:13px 18px;
  margin:0 0 26px;align-items:baseline;
}
.aviso b{font-family:var(--serif);font-size:16px;font-weight:600}
.aviso span{font-size:14px;opacity:.92}

.nota{font-size:13px;color:var(--faint);max-width:70ch;margin-top:26px;padding-top:14px;border-top:1px solid var(--rule)}

/* ---------- términos enlazados ---------- */
.ref{
  background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;
  border-bottom:1px dotted var(--guinda);cursor:help;line-height:inherit;
}
.ref:hover{color:var(--guinda);border-bottom-style:solid;background:var(--guinda-wash)}
.tip{
  position:fixed;z-index:60;max-width:330px;background:var(--card);
  border:1px solid var(--ink);box-shadow:0 10px 26px rgba(28,35,33,.2);
  padding:13px 15px;font-size:13.5px;line-height:1.45;
}
.tip h6{margin:0 0 5px;font-family:var(--serif);font-size:15px;font-weight:600}
.tip .tk{font-size:11px;color:var(--guinda);display:block;margin-bottom:3px}
.tip p{margin:0 0 10px;color:var(--soft);max-width:none}
.tip button{
  background:var(--ink);color:var(--paper);border:0;padding:5px 12px;
  border-radius:2px;font-size:12.5px;
}
.tip button:hover{background:var(--guinda)}
.interruptor{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--soft);
  background:none;border:1px solid var(--rule-hard);border-radius:2px;padding:4px 9px;
}
.interruptor:hover{border-color:var(--guinda);color:var(--guinda)}
.interruptor i{
  width:22px;height:12px;border-radius:7px;background:var(--rule-hard);
  position:relative;transition:background .15s;flex-shrink:0;
}
.interruptor i::after{
  content:"";position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:50%;
  background:var(--card);transition:left .15s;
}
.interruptor[aria-pressed="true"] i{background:var(--guinda)}
.interruptor[aria-pressed="true"] i::after{left:12px}
@media (prefers-reduced-motion:reduce){.interruptor i,.interruptor i::after{transition:none}}

/* ---------- tablero de procesos ---------- */
.objetivos{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.obj{
  flex:1;min-width:170px;background:var(--card);border:1px solid var(--rule);
  padding:12px 15px;border-left:2px solid var(--ink);
}
.obj b{display:block;font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.1}
.obj span{font-size:12.5px;color:var(--soft)}
.obj.alerta{border-left-color:var(--guinda)}
.obj.alerta b{color:var(--guinda)}

.fase{margin-bottom:30px}
.fase-tope{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  border-bottom:1px solid var(--rule-hard);padding-bottom:6px;margin-bottom:12px;
}
.fase-tope h3{margin:0;font-family:var(--serif);font-size:19px;font-weight:600}
.fase-tope span{font-size:12.5px;color:var(--faint)}
.fase-tope em{font-style:normal;margin-left:auto;font-size:12px;color:var(--soft)}

.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:10px}
.et{
  background:var(--card);border:1px solid var(--rule);border-radius:2px;
  padding:13px 15px 0;text-align:left;display:flex;flex-direction:column;
  position:relative;overflow:hidden;min-height:146px;
}
.et:hover{border-color:var(--guinda)}
.et:hover .et-num{color:var(--guinda-wash)}
.et-num{
  position:absolute;top:2px;right:9px;font-family:var(--serif);font-size:46px;
  font-weight:600;color:#EFEFE9;line-height:1;pointer-events:none;transition:color .15s;
}
.et-zoho{
  font-size:10.5px;letter-spacing:.02em;color:var(--faint);
  text-transform:uppercase;margin-bottom:6px;position:relative;
}
.et h4{
  margin:0 0 4px;font-family:var(--serif);font-size:17px;font-weight:600;
  line-height:1.2;position:relative;padding-right:26px;
}
.et .quien{font-size:12px;color:var(--soft);margin-bottom:10px}
.et .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-bottom:12px}
.et .chip{
  font-size:11px;padding:2px 7px;border:1px solid var(--rule-hard);
  border-radius:2px;color:var(--soft);white-space:nowrap;
}
.et .chip.mal{color:var(--warn);border-color:#E0D0A8;background:var(--warn-wash)}
.et .chip.vieja{color:var(--guinda);border-color:#D9B3BD}
.et-alerta{
  margin:0 -15px;padding:7px 15px;background:var(--guinda-wash);
  border-top:1px solid #D9B3BD;font-size:11.5px;color:var(--guinda);
}
.et-vacia{border-style:dashed;background:repeating-linear-gradient(135deg,var(--card),var(--card) 7px,#F0F0EA 7px,#F0F0EA 8px)}

.entrada-caso{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--ink);color:var(--paper);padding:16px 20px;margin:0 0 26px;
}
.entrada-caso b{font-family:var(--serif);font-size:18px;font-weight:600}
.entrada-caso span{font-size:13.5px;opacity:.8;flex:1;min-width:200px}
.entrada-caso button{
  background:var(--paper);color:var(--ink);border:0;padding:8px 16px;
  border-radius:2px;font-size:14px;
}
.entrada-caso button:hover{background:var(--guinda);color:#fff}

.m-nuevo{color:var(--nuevo);background:var(--nuevo-wash)}
.resaltado{animation:realce 2.2s ease-out}
.resaltado > td, .resaltado{background:var(--warn-wash) !important}
@keyframes realce{0%{background:var(--warn-wash)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.resaltado{animation:none}}
/* mientras la app no se da a conocer, nada se marca como reciente */
body[data-inicial] .m-nuevo{display:none}
body[data-inicial] .reciente{border-left-color:var(--rule-hard) !important}
body[data-inicial] .ficha[style*="var(--nuevo)"]{border-left:1px solid var(--rule) !important}
body[data-inicial] .aviso-nuevo{display:none}
body[data-inicial] .et-nuevo{display:none}
body[data-inicial] .cambio.esteMes{border-left-color:var(--rule-hard)}
.cara{color:var(--guinda);font-weight:600}
.reciente{border-left:2px solid var(--nuevo) !important;padding-left:14px}
.et-nuevo{
  margin:0 -15px;padding:7px 15px;background:var(--nuevo-wash);
  border-top:1px solid #BCD4D9;font-size:11.5px;color:var(--nuevo);
}
.aviso-nuevo{
  display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;
  background:var(--nuevo-wash);border:1px solid #BCD4D9;color:var(--nuevo);
  padding:13px 18px;margin:0 0 26px;
}
.aviso-nuevo b{font-family:var(--serif);font-size:16px;font-weight:600}
.aviso-nuevo span{font-size:14px;color:var(--ink);flex:1;min-width:180px}
.aviso-nuevo button{
  background:var(--nuevo);color:#fff;border:0;padding:6px 14px;border-radius:2px;font-size:13px;
}
.aviso-nuevo button:hover{background:var(--ink)}
.dia{display:flex;align-items:baseline;gap:12px;margin:26px 0 10px}
.dia h3{margin:0;font-family:var(--serif);font-size:19px;font-weight:600}
.dia span{font-size:12.5px;color:var(--faint)}
.dia hr{flex:1;border:0;border-top:1px solid var(--rule)}
.cambio{
  background:var(--card);border:1px solid var(--rule);border-left:2px solid var(--rule-hard);
  padding:12px 15px;margin-bottom:8px;
}
.cambio.esteMes{border-left-color:var(--nuevo)}
.cambio h4{margin:0 0 4px;font-family:var(--serif);font-size:16px;font-weight:600}
.cambio p{margin:0;font-size:14px;color:var(--soft)}
.cambio .pie{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}

/* ---------- formato de CB ---------- */
.bloqueF{border:1px solid var(--rule);background:var(--card)}
.secF{
  display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;
  background:none;border:0;border-top:1px solid var(--rule-hard);
  padding:16px 0 10px;margin:22px 0 0;
}
.secF:hover .secF-t{color:var(--guinda)}
.secF .flecha{color:var(--faint);font-size:13px;line-height:1.6;flex-shrink:0}
.secF-t{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.01em;flex:1}
.secF-n{font-size:12.5px;color:var(--faint);white-space:nowrap}
.secF-cuerpo{padding-top:4px}
.secF-cuerpo[hidden]{display:none}
.reglaF{display:flex;gap:12px;padding:12px 15px;border-bottom:1px solid var(--rule)}
.reglaF:last-child{border-bottom:0}
.reglaF.esteMes{border-left:2px solid var(--nuevo)}
.reglaF .rn{
  font-family:var(--serif);font-size:15px;font-weight:600;color:var(--faint);
  min-width:22px;flex-shrink:0;padding-top:1px;
}
.reglaF p{margin:0;font-family:var(--serif);font-size:15.5px;line-height:1.5;max-width:68ch}
.reglaF .rnota{
  margin-top:6px;font-family:var(--sans);font-size:13px;color:var(--soft);line-height:1.45;
}
.reglaF .marbete{margin-top:7px;display:inline-block}
.ejemplo{background:var(--card);border:1px solid var(--rule);border-left:2px solid var(--ink);padding:13px 16px;margin-bottom:8px}
.ejemplo h4{margin:0 0 6px;font-family:var(--serif);font-size:16px;font-weight:600}
.ejemplo .caso{margin:0 0 8px;font-size:14px;color:var(--soft)}

  .cuerpo{grid-template-columns:1fr;gap:18px}
  nav.rail{position:static;border-bottom:1px solid var(--rule-hard);padding-bottom:12px}
  .rail h4{margin-top:14px}

  .buscador{margin-left:0;max-width:none}

}
@media (prefers-reduced-motion:no-preference){
  .revela{animation:sube .22s ease-out}

}

let decisiones = {};
let memoria = {};
let extra = {};

async function leerDecisiones(){
  try{
    const r = await window.storage.get("decisiones");
    if(r && r.value) decisiones = JSON.parse(r.value);
  }catch(e){ decisiones = memoria; }
}
async function leerExtra(){
  try{ const r = await window.storage.get("extra"); if(r && r.value) extra = JSON.parse(r.value); }catch(e){}
}
async function guardarExtra(){
  try{ await window.storage.set("extra", JSON.stringify(extra)); }catch(e){}
}
async function guardarDecisiones(){
  memoria = decisiones;
  try{ await window.storage.set("decisiones", JSON.stringify(decisiones)); }catch(e){}
}

const FASES = {

function resuelto(id){ const c = CONFLICTOS.find(x=>x.id===id); return decisiones[id] || (c && c.cerrado) || null; }
/* El estado de una cuenta se calcula a partir de sus tres apartados, no se
   declara a mano: así la etiqueta nunca puede mentir y se actualiza sola. */
/* Lo que la tabla muestra de cada cuenta: el resumen si existe, si no la primera
   regla general, si no la primera de registro. Solo dice que no hay reglas cuando
   de verdad los tres apartados están vacíos. */
function resumenDe(c){
  const g = (c.generales||[])[0];
  const t = c.resumen || (g && (g.t + (g.sub ? " " + g.sub.join(" ") : ""))) || (c.registro[0] && c.registro[0].t) || (c.revision[0] && c.revision[0].t);
  if(!t) return '<span class="vacio">Sin una sola regla escrita.</span>';
  return esc(t.length > 190 ? t.slice(0,188).replace(/\s+\S*$/,"") + "…" : t);
}

function estadoDe(c){
  const n = [!!(c.resumen || c.subcuentas || (c.generales||[]).length), c.registro.length>0, c.revision.length>0].filter(Boolean).length;
  return n===3 ? "completa" : (n===0 ? "sin criterio" : "incompleta");
}

};

function pintarHilo(){
  const cont = document.getElementById("hilo");
  if(!cont || !hilo) return;
  const A = ARBOLES[hilo.a];
  let id = A.ini, h = `<h2>${esc(A.n)}</h2><div class="hilo">`;

  for(let i=0;;i++){
    const nodo = A.nodos[id];
    if(!nodo) break;
    if(nodo.fin){ h += terminal(nodo); break; }
    const elegida = hilo.cam[i];
    if(elegida !== undefined){
      const op = nodo.o[elegida];
      h += `<div class="paso"><p class="pregunta">${esc(nodo.p)}</p>
        <p class="elegida"><b>${esc(op.t)}</b> · <button class="lnk" data-volver="${i}" style="background:none;border:0;padding:0;color:var(--guinda);text-decoration:underline">cambiar</button></p></div>`;
      id = op.ir;
    }else{
      h += `<div class="paso viva"><p class="pregunta">${esc(nodo.p)}</p><div class="opciones">`;
      nodo.o.forEach((o,j)=> h += `<button data-resp="${j}">${esc(o.t)}</button>`);
      h += `</div></div>`;
      break;
    }
  }
  h += `</div>`;
  cont.innerHTML = h;
  enlazar(cont);

  cont.querySelectorAll("[data-resp]").forEach(b=>{
    b.onclick = ()=>{ hilo.cam.push(+b.dataset.resp); pintarHilo(); };
  });
  cont.querySelectorAll("[data-volver]").forEach(b=>{
    b.onclick = ()=>{ hilo.cam = hilo.cam.slice(0, +b.dataset.volver); pintarHilo(); };
  });
  cont.querySelectorAll("[data-conf]").forEach(b=>{
    b.onclick = ()=> ir("conflictos", b.dataset.conf);
  });
}

    if(d){

      h += `<div style="margin-top:14px">
        <textarea id="t-${c.id}" rows="2" placeholder="Escribe aquí cuál regla queda vigente y cuál se deroga…"

        <div class="fila-btn"><button class="btn" data-resolver="${c.id}">Registrar decisión</button>
        ${c.ver?`<button class="btn btn-hueco" data-ev="${c.ver}">Ver la evidencia</button>`:""}</div>
        ${c.sug?`<p style="font-size:12.5px;color:var(--faint);margin:8px 0 0">Redacción sugerida a partir de lo que HTTax puede evaluar. Edítala antes de registrar.</p>`:""}</div>`;
    }
    h += `</div>`;
  });

  h += `<div class="fila-btn" style="margin-top:20px"><button class="btn btn-hueco" id="exportar">Copiar todas las decisiones</button></div>
  <p class="nota">Las decisiones se guardan en este navegador. El botón de copiar las saca en texto plano para pegarlas en el documento maestro, que es donde tienen que vivir de verdad.</p>`;

  setTimeout(()=>{
    document.querySelectorAll("[data-resolver]").forEach(b=>{
      b.onclick = async ()=>{
        const id = b.dataset.resolver;
        const txt = document.getElementById("t-"+id).value.trim();
        if(!txt) return document.getElementById("t-"+id).focus();
        decisiones[id] = {txt, fecha: new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})};
        await guardarDecisiones(); pintarRail(); pintar();
      };
    });
    document.querySelectorAll("[data-borrar]").forEach(b=>{
      b.onclick = async ()=>{ delete decisiones[b.dataset.borrar]; await guardarDecisiones(); pintarRail(); pintar(); };
    });
    document.querySelectorAll("[data-ev]").forEach(b=> b.onclick = ()=> ir(b.dataset.ev));
    const ex = document.getElementById("exportar");

      }).join("\n\n");
      navigator.clipboard.writeText(t).then(()=>{ ex.textContent = "Copiado"; setTimeout(()=>ex.textContent="Copiar todas las decisiones",1600); });
    };
    if(ruta.id) document.getElementById(ruta.id)?.scrollIntoView({block:"center"});
  },0);
  return h;
}

/* ---------- faltantes ---------- */
function vFaltantes(){
  const TIPOS = {
    decidir:{n:"Falta que lo decidas", d:"Criterio que todavía no está tomado. Con dos o tres renglones se redacta y se carga.", c:"var(--guinda)"},
    hacer:{n:"Ya está decidido, falta hacerlo", d:"La regla existe. Lo que falta es el trabajo: corregir un documento, llenar una tabla, crear una sección.", c:"var(--warn)"},
    desarrollar:{n:"Necesita desarrollo", d:"No se resuelve escribiendo. Requiere tocar HTTax, el VPS o la app.", c:"var(--nuevo)"},
    averiguar:{n:"Hay que averiguarlo primero", d:"No se puede decidir sin un dato que hoy no se tiene: verificar cómo se comporta una herramienta, revisar si algo sigue cubierto.", c:"var(--soft)"}
  };
  const urg = t => FALTANTES.filter(f=>f.tipo===t && f.p===1).length;
  let h = `<h1>Lo que queda por hacer</h1>
  <p class="entrada">Cada renglón tiene un caso real detrás. No es una lista de deseos: es el registro de lo que ya falló por no estar escrito, o de lo que se decidió y todavía no se ejecuta. Están agrupados por quién tiene que mover la ficha.</p>
  <div class="objetivos">`;
  Object.keys(TIPOS).forEach(t=>{
    const n = FALTANTES.filter(f=>f.tipo===t).length;
    h += `<div class="obj${urg(t)?' alerta':''}" style="border-left-color:${TIPOS[t].c}"><b>${n}</b><span>${esc(TIPOS[t].n)}${urg(t)?` · ${urg(t)} urgentes`:""}</span></div>`;
  });
  h += `</div>`;

  Object.keys(TIPOS).forEach(t=>{
    const fs = FALTANTES.filter(f=>f.tipo===t).sort((a,b)=>a.p-b.p);
    if(!fs.length) return;
    h += `<h2>${esc(TIPOS[t].n)}</h2>
    <p class="entrada" style="margin-bottom:12px">${esc(TIPOS[t].d)}</p>
    <table class="datos"><tr><th style="width:36%">Qué falta</th><th>Por qué está en la lista</th><th style="width:96px">Urgencia</th></tr>`;
    fs.forEach(f=> h += `<tr><td style="font-weight:500;border-left:2px solid ${f.p===1?TIPOS[t].c:'transparent'};padding-left:12px">${esc(f.r)}${esReciente(f.mod)?' <span class="marbete m-nuevo">nuevo</span>':''}</td>
      <td style="color:var(--soft)">${esc(f.c)}</td>
      <td><span class="marbete ${f.p===1?'m-alto':(f.p===2?'m-tibio':'m-gris')}">${f.p===1?"ya falló":(f.p===2?"riesgo":"de fondo")}</span></td></tr>`);
    h += `</table>`;
  });

  h += `<p class="nota">La urgencia dice si el pendiente ya produjo un error documentado, si es un riesgo conocido que todavía no se materializó, o si es un vacío de fondo que no aprieta. El grupo dice a quién le toca. En la versión con base de datos esta lista se llena sola: cada vez que alguien llega a un callejón sin salida en Consultar, se registra el caso y aparece aquí.</p>`;
  return h;
}

/* ---------- conceptos de HTTax ---------- */
/* ============================================================
   ENLACES DENTRO DEL TEXTO
   Cada sigla, cuenta, etapa y punto de auditoría que aparezca
   en cualquier párrafo se vuelve consultable sin salir de él.
   ============================================================ */
let enlacesOn = true;
const TERMINOS = [];
(function construirTerminos(){
  const add = (m, k, t, d, v, id, exacto) => TERMINOS.push({m, k, t, d, v, id, exacto, i:TERMINOS.length});
  SIGLAS.forEach(s=>{
    if(s.s === "Avance" || !s.d) return;
    add(s.s, "Sigla", s.s, s.d, "glosario", null, s.s === s.s.toUpperCase());
    // términos que se nombran de dos maneras: cada nombre engancha por su cuenta
    if(s.s === "Ficha o tarea"){
      ["ficha","fichas","tarea","tareas"].forEach(v=> add(v, "Término", "Ficha o tarea", s.d, "glosario", null, false));
    }
  });
  CUENTAS.forEach(c=>{
    add(c.n, "Política de registro", c.n, c.resumen || "Rubro sin criterio escrito.", "cuentas", c.id, false);
  });
  add("IVA NO ACREDITABLE DEDUCIBLE", "Cuenta", "IVA NO ACREDITABLE DEDUCIBLE",
      "Nombre único desde el 14 de septiembre de 2026. Antes tenía cuatro variantes. Ahí va el IVA de un comprobante que por algún requisito de LISR no es deducible. Nombre único de la cuenta.", "cuentas", "gastos", true);
  add("IVA NO ACREDITABLE FACTOR", "Cuenta", "IVA NO ACREDITABLE FACTOR",
      "Otra cuenta, no un sinónimo. Ahí va el IVA no acreditable por factor de acreditamiento del artículo 5 de LIVA o por proporción de público en general de los RIF.", "cuentas", "gastos", true);
  ETAPAS.forEach(e=>{
    add("etapa "+e.n, "Etapa del cierre", e.n+". "+e.t, e.s, "proceso", String(e.n), false);
  });
  PUNTOS.forEach(p=>{
    add("punto "+p.n, "Punto de auditoría", "Punto "+p.n+" de HTTax", p.t, "revision", null, false);
  });
  // términos que no van al glosario pero sí se explican al pasar el cursor
  ["cascada","cascada de caja"].forEach(v=>
    add(v, "Secuencia de opciones", "La cascada de un depósito en efectivo no reconocido",
        "Aplica a un depósito que entró en efectivo y que el cliente dijo no reconocer. Si entró por transferencia o cheque no aplica: va a acreedores diversos. Los cuatro supuestos se prueban en orden y solo se pasa al siguiente cuando el anterior se descarta. Uno: se trata como si el dinero hubiera salido de la caja irreal. Dos: si no hay caja irreal, se abona a ventas en efectivo no depositadas. Tres: si tampoco hay saldo ahí, se trata como reintegro en efectivo de un gasto por comprobar de meses atrás. Cuatro: si no existe nada de lo anterior, se reconoce como anticipo de clientes, desglosando el IVA si la actividad lo causa.",
        "cuentas", "caja", false));

  FORMAS_PAGO.forEach(f=>{
    add("forma de pago "+f.c, "Forma de pago", f.c+" — "+f.n, f.t, "glosario", null, false);
  });
  TERMINOS.sort((a,b)=> b.m.length - a.m.length);
  // el índice se fija DESPUÉS de ordenar: si no, cada término apunta a otro
  TERMINOS.forEach((t,k)=>{ t.i = k; });
})();

const MAPA = {};
TERMINOS.forEach(t=>{ const k = t.exacto ? t.m : t.m.toLowerCase(); if(!(k in MAPA)) MAPA[k] = t; });

const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const RE_TERM = new RegExp("(?:^|(?<=[^\\wÁÉÍÓÚÑáéíóúñ]))(" +
  TERMINOS.map(t=>escRe(t.m)).join("|") + ")(?![\\wÁÉÍÓÚÑáéíóúñ])", "g");
const RE_TERM_I = new RegExp(RE_TERM.source, "gi");

const RE_PUNTOS = /\bpuntos?\s+(\d{1,2}(?:\s*(?:,|y|a|e)\s*\d{1,2})*)/gi;

function enlazarPuntos(cont){
  if(!enlacesOn || !cont) return;
  const walker = document.createTreeWalker(cont, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      const p = n.parentElement;
      if(!p || p.closest("button, textarea, .ref, .sig, .marbete, h1, .tip, .sello, .resultados")) return NodeFilter.FILTER_REJECT;
      return /\bpuntos?\s+\d/i.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const nodos = [];
  while(walker.nextNode()) nodos.push(walker.currentNode);

  nodos.forEach(n=>{
    const txt = n.nodeValue;
    const frag = document.createDocumentFragment();
    let ult = 0, hubo = false, m;
    RE_PUNTOS.lastIndex = 0;
    while((m = RE_PUNTOS.exec(txt)) !== null){
      const inicio = m.index + m[0].length - m[1].length;
      frag.appendChild(document.createTextNode(txt.slice(ult, inicio)));
      // dentro de la lista de números, cada uno se vuelve enlace
      const lista = m[1];
      let pos = 0;
      lista.replace(/\d{1,2}/g, (num, off)=>{
        frag.appendChild(document.createTextNode(lista.slice(pos, off)));
        const t = MAPA["punto " + num];
        if(t){
          const b = document.createElement("button");
          b.className = "ref";
          b.textContent = num;
          b.dataset.ref = t.i;
          b.setAttribute("aria-label", "punto de auditoría " + num);
          frag.appendChild(b);
          hubo = true;
        }else{
          frag.appendChild(document.createTextNode(num));
        }
        pos = off + num.length;
        return num;
      });
      frag.appendChild(document.createTextNode(lista.slice(pos)));
      ult = m.index + m[0].length;
    }
    if(hubo){
      frag.appendChild(document.createTextNode(txt.slice(ult)));
      n.parentNode.replaceChild(frag, n);
    }
  });
}

function enlazar(cont){
  enlazarPuntos(cont);
  if(!enlacesOn || !cont) return;
  const walker = document.createTreeWalker(cont, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!n.nodeValue || n.nodeValue.length < 2) return NodeFilter.FILTER_REJECT;
      const p = n.parentElement;
      if(!p || p.closest("button, textarea, .ref, .sig, .marbete, h1, .tip, .sello, .resultados")) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodos = [];
  while(walker.nextNode()) nodos.push(walker.currentNode);

  const memoria = new Map(); // bloque -> términos ya enlazados ahí
  nodos.forEach(n=>{
    const bloque = n.parentElement.closest("td, li, p, h2, h3, .paso, .ficha, .vacio-caja") || cont;
    if(!memoria.has(bloque)) memoria.set(bloque, new Set());
    const usados = memoria.get(bloque);
    const txt = n.nodeValue;
    RE_TERM_I.lastIndex = 0;
    let m, ult = 0, hubo = false;
    const frag = document.createDocumentFragment();
    while((m = RE_TERM_I.exec(txt)) !== null){
      const bruto = m[1];
      const t = MAPA[bruto] || MAPA[bruto.toLowerCase()];
      if(!t) continue;
      if(t.exacto && bruto !== t.m) continue;   // las siglas solo cuentan en mayúsculas
      if(usados.has(t.i)) continue;             // una vez por bloque, para no saturar
      usados.add(t.i);
      hubo = true;
      frag.appendChild(document.createTextNode(txt.slice(ult, m.index + m[0].length - bruto.length)));
      const b = document.createElement("button");
      b.className = "ref";
      b.textContent = bruto;
      b.dataset.ref = t.i;
      b.setAttribute("aria-label", bruto + ", ver definición");
      frag.appendChild(b);
      ult = m.index + m[0].length;
    }
    if(hubo){
      frag.appendChild(document.createTextNode(txt.slice(ult)));
      n.parentNode.replaceChild(frag, n);
    }
  });
}

let tip = null;
function cerrarTip(){ if(tip){ tip.remove(); tip = null; } }

function abrirTip(btn){
  cerrarTip();
  const t = TERMINOS[+btn.dataset.ref];
  if(!t) return;
  tip = document.createElement("div");
  tip.className = "tip";
  tip.innerHTML = `<span class="tk">${esc(t.k)}</span><h6>${esc(t.t)}</h6>
    <p>${esc(t.d || "Sin definición escrita todavía.")}</p>
    <button data-abrir="1">Abrir</button>`;
  tip.addEventListener("mouseenter", ()=> clearTimeout(relojTip));
  tip.addEventListener("mouseleave", ()=> { relojTip = setTimeout(cerrarTip, 200); });
  document.body.appendChild(tip);
  const r = btn.getBoundingClientRect(), tr = tip.getBoundingClientRect();
  let x = r.left, y = r.bottom + 7;
  if(x + tr.width > innerWidth - 12) x = Math.max(12, innerWidth - tr.width - 12);
  if(y + tr.height > innerHeight - 12) y = Math.max(12, r.top - tr.height - 7);
  tip.style.left = x + "px";
  tip.style.top = y + "px";
  tip.querySelector("[data-abrir]").onclick = ()=>{ cerrarTip(); ir(t.v, t.id); };
}

document.addEventListener("click", e=>{
  const r = e.target.closest(".ref");
  if(r){ e.stopPropagation(); clearTimeout(relojTip); abrirTip(r); return; }
  if(!e.target.closest(".tip")) cerrarTip();
});

/* la definición también aparece al pasar el cursor */
let relojTip = null;
document.addEventListener("mouseover", e=>{
  const r = e.target.closest(".ref");
  if(r){ clearTimeout(relojTip); relojTip = setTimeout(()=> abrirTip(r), 200); return; }
  if(e.target.closest(".tip")) clearTimeout(relojTip);
});
document.addEventListener("mouseout", e=>{
  if(e.target.closest(".ref") || e.target.closest(".tip")){
    clearTimeout(relojTip);
    relojTip = setTimeout(cerrarTip, 320);
  }
});
document.addEventListener("keydown", e=>{ if(e.key === "Escape") cerrarTip(); });
addEventListener("scroll", cerrarTip, true);
addEventListener("resize", cerrarTip);

document.getElementById("swEnlaces").addEventListener("click", function(){
  enlacesOn = !enlacesOn;
  this.setAttribute("aria-pressed", String(enlacesOn));
  cerrarTip();
  pintar();
});

EJEMPLOS_CB.forEach(e => INDICE.push({t:"Ejemplo de conciliación", n:e.t, d:e.d, v:"formato", id:"f-"+e.sec}));
REGLAS_GENERALES.reglas.forEach(r=> INDICE.push({t:"Reglas generales de registro", n:REGLAS_GENERALES.t, d:r.h.replace(/<[^>]+>/g,""), v:"cuentas"}));

INDICE.push({t:"Política", n:"Comunicación interna", d:COMUNICACION.regla, v:"proceso"});

CAMBIOS.forEach(c => INDICE.push({t:"Modificación · "+fechaLarga(c.f), n:c.t, d:c.d, v:"cambios"}));
ETAPAS.forEach(e => INDICE.push({t:"Estado de Zoho", n:e.z, d:"Corresponde a la etapa "+e.n+", "+e.t, v:"proceso", id:String(e.n)}));
FORMAS_PAGO.forEach(f => INDICE.push({t:"Forma de pago "+f.c, n:f.n, d:f.t, v:"glosario", id:"g-fp-"+f.c}));

const qi = document.getElementById("q"), rd = document.getElementById("res");
qi.addEventListener("input", ()=>{
  const t = qi.value.trim().toLowerCase();
  if(t.length < 2){ rd.hidden = true; return; }
  const hits = INDICE.filter(x => (x.n+" "+x.d+" "+x.t).toLowerCase().includes(t)).slice(0,12);
  if(!hits.length){
    rd.innerHTML = `<button disabled style="color:var(--faint);cursor:default"><span class="rtipo">Sin coincidencias</span>
      <span class="rtxt">Si el caso existe y no está aquí, es una regla por escribir.</span></button>`;
  }else{
    rd.innerHTML = hits.map((x,i)=>
      `<button data-h="${i}"><span class="rtipo">${esc(x.t)}</span>${esc(x.n)}
       <span class="rtxt"><br>${esc(x.d.slice(0,110))}${x.d.length>110?"…":""}</span></button>`).join("");
    rd.querySelectorAll("[data-h]").forEach(b=> b.onclick = ()=>{
      const x = hits[+b.dataset.h];
      rd.hidden = true; qi.value = "";
      ir(x.v, x.id);
    });
  }
  rd.hidden = false;
});
qi.addEventListener("blur", ()=> setTimeout(()=> rd.hidden = true, 180));
document.addEventListener("keydown", e=>{
  if(e.key === "Escape"){ rd.hidden = true; qi.blur(); }
});
